# -----------------------------------------------------------------------------
# GeochemCondition
#
# Maps named geochemical conditions from the engine input deck onto geometries,
# setting the initial chemical state of the domain.
# -----------------------------------------------------------------------------

GeochemCondition:
  __doc__: ''

  Type:
    help: >
      [Type: string] How geochemical conditions are assigned to geometries. Constant assigns one
      named condition per geometry, constant in time.
    default: Constant
    domains:
      EnumDomain:
        enum_list:
          - Constant

  Names:
    help: >
      [Type: string] Space-separated list of geochemical condition names. Each must correspond to a
      Condition block in the engine input deck.
    domains:
      AnyString:

  GeomNames:
    help: >
      [Type: string] Space-separated list of geometry names whose cells are initialized from a
      geochemical condition. Where geometries overlap, later names take precedence.
    domains:
      AnyString:

  Geom:
    __class__: GeochemCondGeom
    __doc__: ''

    .{geom_name}:
      __class__: GeochemCondGeomItem
      __rst__:
        skip:
      __doc__: ''

      Value:
        help: >
          [Type: string] The geochemical condition name (from GeochemCondition.Names) used to
          initialize the cells of this geometry.
        domains:
          AnyString:

# -----------------------------------------------------------------------------
# BCConcentration
#
# Assigns named geochemical conditions as solute boundary conditions on patches.
# -----------------------------------------------------------------------------

BCConcentration:
  __doc__: ''

  PatchNames:
    help: >
      [Type: string] Space-separated list of boundary patches on which a geochemical condition is
      imposed as the inflow concentration boundary.
    domains:
      AnyString:

  GeochemCondition:
    __class__: BCConcentrationGeochemCondition
    __doc__: ''

    Names:
      help: >
        [Type: string] Space-separated list of geochemical condition names usable as concentration
        boundary conditions. Each must correspond to a Condition block in the engine input deck.
      domains:
        AnyString:
