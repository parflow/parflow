name: Release Linux binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and package (Ubuntu 22.04 GCC)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Package Install
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install curl cmake build-essential tcl-dev tk-dev gfortran \
            zlib1g-dev libcurl4-openssl-dev patchelf file

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-parflow-dependencies
        with:
          path: "~/depend"
          key: release-linux-bundle-${{ hashFiles('**/.github/workflows/release-linux-binaries.yml') }}

      - name: Directory Setup
        run: |
          mkdir -p "$HOME/install"
          mkdir -p "$HOME/depend"/{include,lib,bin}

          echo "PARFLOW_DIR=$HOME/install" >> "$GITHUB_ENV"
          echo "PARFLOW_DEP_DIR=$HOME/depend" >> "$GITHUB_ENV"
          echo "$HOME/depend/bin" >> "$GITHUB_PATH"
          echo "$HOME/install/bin" >> "$GITHUB_PATH"

      - name: CMake Install
        env:
          CACHE_HIT: ${{ steps.cache-parflow-dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            cd "$HOME/depend"
            wget -nv --no-check-certificate \
              https://github.com/Kitware/CMake/releases/download/v3.26.5/cmake-3.26.5-linux-x86_64.tar.gz
            tar -xf cmake-3.26.5-linux-x86_64.tar.gz
          fi
          echo "$HOME/depend/cmake-3.26.5-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: OpenMPI Install
        env:
          CACHE_HIT: ${{ steps.cache-parflow-dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            URL=https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.6.tar.gz
            mkdir openmpi && cd openmpi
            curl -L "$URL" | tar --strip-components=1 -xz
            ./configure --prefix="$PARFLOW_DEP_DIR" --disable-static
            make -j "$(nproc)"
            make install
          fi

      - name: HDF5 Install
        env:
          CACHE_HIT: ${{ steps.cache-parflow-dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            URL=https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.14/hdf5-1.14.3/src/hdf5-1.14.3.tar.gz
            mkdir -p hdf5-build && cd hdf5-build
            curl -L "$URL" | tar -xz
            cd hdf5-1.14.3
            CC=mpicc CXX=mpicxx ./configure \
              --prefix="$PARFLOW_DEP_DIR" \
              --enable-shared \
              --enable-parallel \
              --disable-static
            make -j "$(nproc)"
            make install
          fi

      - name: NetCDF Install
        env:
          CACHE_HIT: ${{ steps.cache-parflow-dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            URL=https://github.com/Unidata/netcdf-c/archive/v4.9.0.tar.gz
            mkdir netcdf-c && cd netcdf-c
            curl -L "$URL" | tar --strip-components=1 -xz
            CC=mpicc \
              CPPFLAGS="-I${PARFLOW_DEP_DIR}/include" \
              LDFLAGS="-L${PARFLOW_DEP_DIR}/lib" \
              ./configure --prefix="$PARFLOW_DEP_DIR" --enable-shared
            make -j "$(nproc)"
            make install
            cd ..

            URL=https://github.com/Unidata/netcdf-fortran/archive/v4.5.4.tar.gz
            mkdir netcdf-fortran && cd netcdf-fortran
            curl -L "$URL" | tar --strip-components=1 -xz
            CC=mpicc FC=mpifort \
              CPPFLAGS="-I${PARFLOW_DEP_DIR}/include" \
              LDFLAGS="-L${PARFLOW_DEP_DIR}/lib" \
              ./configure --prefix="${PARFLOW_DEP_DIR}"
            make -j "$(nproc)"
            make install
          fi
          echo "NETCDF_FLAGS=-DNETCDF_DIR=$PARFLOW_DEP_DIR -DNETCDF_Fortran_ROOT=$PARFLOW_DEP_DIR -DPARFLOW_ENABLE_HDF5=TRUE" >> "$GITHUB_ENV"

      - name: HYPRE Install
        env:
          CACHE_HIT: ${{ steps.cache-parflow-dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' ]]; then
            wget -q https://github.com/hypre-space/hypre/archive/v2.33.0.tar.gz
            tar xf v2.33.0.tar.gz && cd hypre-2.33.0
            cmake -S src -B build \
              -DCMAKE_C_COMPILER=mpicc \
              -DCMAKE_CXX_COMPILER=mpicxx \
              -DCMAKE_INSTALL_PREFIX="${PARFLOW_DEP_DIR}" \
              -DHYPRE_ENABLE_MPI=ON \
              -DHYPRE_ENABLE_CUDA=OFF
            cmake --build build --parallel "$(nproc)"
            cmake --install build
          fi

      - name: ParFlow CMake Configure
        run: |
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export OMP_NUM_THREADS=1
          export OMPI_CC=gcc OMPI_CXX=g++ OMPI_FC=gfortran
          export CC=mpicc CXX=mpicxx F77=mpif77 FC=mpif90
          CFLAGS="-Wall -Wno-unused-result -Wno-unused-function -Wno-stringop-overread"
          # shellcheck disable=SC2086
          cmake -Bbuild \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DPARFLOW_ENABLE_TIMING=TRUE \
            -DPARFLOW_AMPS_LAYER=mpi1 \
            -DMPIEXEC_POSTFLAGS='--oversubscribe' \
            -DPARFLOW_ACCELERATOR_BACKEND=none \
            -DPARFLOW_AMPS_SEQUENTIAL_IO=true \
            -DPARFLOW_HAVE_CLM=ON \
            -DHYPRE_ROOT="$PARFLOW_DEP_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PARFLOW_DIR" \
            $NETCDF_FLAGS

      - name: ParFlow CMake Build
        run: cmake --build build --parallel "$(nproc)" --target install

      - name: Merge dependency prefix into install tree
        run: |
          set -euo pipefail
          # Libraries and headers built for ParFlow deps
          cp -an "$PARFLOW_DEP_DIR/lib/." "$PARFLOW_DIR/lib/"
          if [[ -d "$PARFLOW_DEP_DIR/lib64" ]]; then
            cp -an "$PARFLOW_DEP_DIR/lib64/." "$PARFLOW_DIR/lib/"
          fi

          # MPI launchers and OpenMPI runtime layout
          for bin in mpiexec mpirun ompi_info prte prted; do
            if [[ -f "$PARFLOW_DEP_DIR/bin/$bin" ]]; then
              cp -a "$PARFLOW_DEP_DIR/bin/$bin" "$PARFLOW_DIR/bin/"
            fi
          done

          for dir in share/openmpi share/prte share/pmix etc/openmpi etc/prte etc/pmix lib/openmpi lib/prte lib/pmix; do
            if [[ -d "$PARFLOW_DEP_DIR/$dir" ]]; then
              mkdir -p "$PARFLOW_DIR/$(dirname "$dir")"
              cp -a "$PARFLOW_DEP_DIR/$dir" "$PARFLOW_DIR/$(dirname "$dir")/"
            fi
          done

      - name: Bundle shared libraries
        run: |
          chmod +x scripts/linux-bundle-deps.sh
          ./scripts/linux-bundle-deps.sh "$PARFLOW_DIR" "$PARFLOW_DEP_DIR" /usr/lib/x86_64-linux-gnu

      - name: Patch config for relocatable install
        run: |
          CFG="$PARFLOW_DIR/config/pf-cmake-env.sh"
          sed -i 's|^MPIEXEC=.*|MPIEXEC="${PARFLOW_DIR}/bin/mpiexec"|' "$CFG"
          {
            echo ''
            echo '# Relocatable MPI stack (OpenMPI / PMIx / PRTE)'
            echo 'export OPAL_PREFIX="${PARFLOW_DIR}"'
            echo 'export OMPI_HOME="${PARFLOW_DIR}"'
            echo 'export PMIX_INSTALL_PREFIX="${PARFLOW_DIR}"'
            echo 'export PMIX_MCA_pcompress_base_silence_warning=1'
          } >> "$CFG"

      - name: Install parflow-env.sh
        run: |
          install -m 0644 "$GITHUB_WORKSPACE/misc/release/parflow-env.sh" "$PARFLOW_DIR/parflow-env.sh"

      - name: Smoke test
        run: |
          CLEAN_PATH="/usr/bin:/bin:/usr/sbin:/sbin:${PARFLOW_DIR}/bin"
          env -i HOME="$HOME" PATH="$CLEAN_PATH" TMPDIR="${TMPDIR:-/tmp}" \
            PARFLOW_DIR="$PARFLOW_DIR" \
            OPAL_PREFIX="$PARFLOW_DIR" OMPI_HOME="$PARFLOW_DIR" \
            PMIX_INSTALL_PREFIX="$PARFLOW_DIR" \
            "$PARFLOW_DIR/bin/parflow" -v

      - name: Package bundle
        run: |
          set -euo pipefail
          cp README-LINUX-BINARY.md "$PARFLOW_DIR/" || true

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            VERSION="${{ github.event_name }}-${{ github.sha }}"
          fi
          OUT="parflow-${VERSION}-linux-x86_64-ubuntu22.04.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${OUT}" -C "$(dirname "$PARFLOW_DIR")" "$(basename "$PARFLOW_DIR")"
          echo "ASSET_NAME=${OUT}" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/${OUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
